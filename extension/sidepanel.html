<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabHelm</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-row">
        <span class="brand">TabHelm</span>
        <span id="rec-indicator" class="rec" hidden><span class="rec-dot"></span>REC</span>
        <span id="status" class="status" data-state="idle">Not connected</span>
        <details class="menu" id="export-menu">
          <summary class="btn small" title="Download this chat and the agent's action log">Export</summary>
          <div class="menu-list">
            <button type="button" data-export="md">Chat + action log (.md)</button>
            <button type="button" data-export="json">Full log (.json)</button>
          </div>
        </details>
        <button id="new-chat" class="btn small" title="Clear the chat and start a fresh agent session">New chat</button>
      </div>
      <div class="bar-row">
        <select id="agent" aria-label="Agent"></select>
        <button id="connect" class="btn">Connect</button>
      </div>
      <div id="config" class="bar-row config" hidden></div>
      <div id="tab" class="tab-line" title="The tab this chat controls"></div>
    </header>

    <div id="news" class="news" hidden></div>

    <main id="log" class="log" aria-live="polite">
      <div class="empty" id="empty">
        <p>Pick a terminal agent and press <b>Connect</b>.</p>
        <p>The agent runs on your machine with its own login and can read, click and type on <b>this tab only</b>.</p>
      </div>
    </main>

    <footer class="composer">
      <textarea id="input" rows="3" placeholder="Ask the agent to do something on this page…" disabled></textarea>
      <div class="composer-row">
        <div class="toggles">
          <label class="auto"><input type="checkbox" id="auto" /> Auto-approve actions</label>
          <label class="auto" title="Record a video of the tab while the agent works on each message"><input type="checkbox" id="record" /> Record video</label>
        </div>
        <button id="send" class="btn primary" disabled>Send</button>
      </div>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
