# Builds TabHelm and publishes a GitHub release when a v* tag is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version and changelog
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != manifest $VERSION"; exit 1; }
          node scripts/release-notes.js "$VERSION" > /dev/null

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$VERSION" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/tabhelm-extension-$VERSION.zip" \
            "dist/tabhelm-$VERSION.tar.gz" \
            dist/tabhelm-extension.zip \
            dist/tabhelm.tar.gz \
            --title "TabHelm $VERSION" \
            --notes-file release-notes.md

      - name: Refresh the site so the panel's news feed announces this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
