# Publishes site/ (landing page, install.sh, news.json feed) to GitHub Pages.
# The Release workflow re-runs it so news.json announces the new version.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/news.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site with news feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r site _site
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName,url,publishedAt > latest.json 2>/dev/null; then
            export TABHELM_LATEST_TAG="$(node -p "require('./latest.json').tagName")"
            export TABHELM_LATEST_URL="$(node -p "require('./latest.json').url")"
            export TABHELM_LATEST_DATE="$(node -p "require('./latest.json').publishedAt.slice(0, 10)")"
          fi
          node scripts/news.js _site/news.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
